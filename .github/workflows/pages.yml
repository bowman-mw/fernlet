# Publishes the static site in `Site/` to GitHub Pages.
#
# The site is plain HTML/CSS/JS with no build step — this workflow just uploads the folder.
#
# ONE-TIME SETUP (owner, in the GitHub UI): Settings → Pages → Build and deployment →
# Source: **GitHub Actions**. Without that, this workflow's deploy step fails with a
# "Pages site not found" style error. To serve it at fernlet.com instead of
# bowman-mw.github.io/fernlet, add the custom domain there too (it writes a `CNAME` file) and
# point DNS at GitHub — see Site/README.md, which also covers the Cloudflare Pages alternative.
#
# NOTE ON HEADERS: GitHub Pages ignores `Site/_headers` (that file is a Cloudflare/Netlify
# feature). The CSP is therefore also declared as a <meta http-equiv> in every page, so the
# "no external requests" guarantee holds on either host. HSTS/X-Frame-Options cannot be set
# from a meta tag; if those matter, deploy on Cloudflare Pages instead.

name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Site/**"
      - ".github/workflows/pages.yml"
  # Lets the owner republish without a Site/ change (e.g. after enabling Pages).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check + upload Site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap, Xcode-free half of FernletTests/PrivacyPolicyParityTests: the hosted policy is
      # the App Store Connect Privacy Policy URL, so it must never go live behind the canonical
      # document. The full three-copy test still runs in the app test suite.
      - name: Hosted privacy policy is in sync with Docs/Privacy-Policy.md
        run: |
          set -euo pipefail
          date="$(sed -n 's/.*effectiveDate = "\([^"]*\)".*/\1/p' App/Fernlet/PrivacyPolicyView.swift | head -1)"
          if [ -z "$date" ]; then
            echo "::error::could not read effectiveDate from App/Fernlet/PrivacyPolicyView.swift"
            exit 1
          fi
          echo "Effective date: $date"
          for f in Docs/Privacy-Policy.md Site/privacy/index.html; do
            grep -qF "$date" "$f" || { echo "::error file=$f::missing effective date $date"; exit 1; }
          done
          while IFS= read -r marker; do
            [ -n "$marker" ] || continue
            grep -qF "$marker" Site/privacy/index.html \
              || { echo "::error file=Site/privacy/index.html::missing clause: $marker"; exit 1; }
          done <<'MARKERS'
          never retroactively repurposed
          The no-collection guarantee does not expire
          requires your fresh, affirmative consent
          verifiability statement
          Docs/Verifiability.md
          Manual plan exchange
          MARKERS

      # The no-tracking wall applies to the website too: nothing may load from another origin.
      - name: No third-party assets in the site
        run: |
          set -euo pipefail
          if grep -rnE '(src|href)="https?://' Site --include='*.html' \
               | grep -vE 'href="https://(github\.com/bowman-mw/fernlet|fernlet\.com)'; then
            echo "::error::a page references an off-origin asset — the site must be self-contained"
            exit 1
          fi

      # The self-hosted fonts are SIL Open Font License 1.1, which lets the site serve them only with
      # each family's license beside the files: <Family>.woff2 or <Family>-<Style>.woff2 needs
      # <Family>-OFL.txt (the table is in Site/fonts/README.md).
      - name: Every self-hosted font ships its license
        run: |
          set -euo pipefail
          missing=0
          for font in Site/fonts/*.woff2; do
            [ -e "$font" ] || continue
            stem="$(basename "$font" .woff2)"
            license="Site/fonts/${stem%%-*}-OFL.txt"
            if [ ! -f "$license" ]; then
              echo "::error file=$font::no license beside it: expected $license"
              missing=1
            fi
          done
          exit "$missing"

      # Universal links: Apple fetches /.well-known/apple-app-site-association for fernlet.com. The
      # file claims exactly one thing for now, the Phase 0 link probe's /probe/ path. Claiming more
      # (Fernlet's own /plan/ and /recipe/) is a deliberate edit here and in Site/README.md.
      - name: The association file is valid JSON and claims only the probe path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("Site/.well-known/apple-app-site-association") as handle:
              details = json.load(handle)["applinks"]["details"]
          claimed = [(app, part.get("/")) for entry in details for app in entry["appIDs"] for part in entry["components"]]
          expected = [("3RTUPF8FFH.MBO.FernletLinkProbe", "/probe/*")]
          if claimed != expected:
              raise SystemExit(f"::error::the association file claims {claimed}, expected {expected}")
          PY

      - uses: actions/configure-pages@v5

      # Keep this at v3. v4 leaves dot-folders out of the artifact without saying so, which would
      # drop Site/.well-known/ and with it the association file. The step after this one checks
      # the artifact itself, so a bump that loses the file fails here and never deploys.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Site

      # The deploy job publishes the artifact, not the folder, so this reads the tar the step above
      # built and uploaded ($RUNNER_TEMP/artifact.tar).
      - name: The uploaded artifact carries the association file and the probe page
        run: |
          set -euo pipefail
          tar -tf "$RUNNER_TEMP/artifact.tar" > "$RUNNER_TEMP/artifact-files.txt"
          for path in .well-known/apple-app-site-association probe/index.html; do
            grep -qxF -e "./$path" -e "$path" "$RUNNER_TEMP/artifact-files.txt" \
              || { echo "::error::$path is missing from the Pages artifact"; exit 1; }
          done

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
