# S3 privacy-wall enforcement (Docs/Security-Hardening-Plan-2026-06-27.md, WI-3).
#
# The carve-up's security feature — AIProviders/CloudKitSync being *structurally incapable* of
# reaching the sealed Private* stores — is only load-bearing when the build runs under
# DIAGNOSE_MISSING_TARGET_DEPENDENCIES=YES_ERROR (the flag must be on the build command; it does
# not reach the synthesized SwiftPM targets from the pbxproj). This workflow runs that check on
# every push/PR so a forbidden cross-wall `import` can never land green.
#
# RUNNER REQUIREMENT: macOS with an **iOS 26.5 SDK or newer** (any Xcode that ships one). Two
# separate floors are in play and both are checked below, in seconds, rather than surfacing as a
# confusing build failure minutes in:
#   * Swift tools 6.2 — FernletKit/Package.swift's tools version. An older toolchain cannot even
#     resolve the package ("using Swift tools version 6.2.0 but the installed version is 6.1.0").
#   * the iOS 26.5 SDK — the app uses API introduced there (AgeRangeService.AgeRangeDeclaration
#     .confirmed, in App/Fernlet/AgeAssuranceRequest.swift).
# The job selects the NEWEST Xcode 26+ on the image rather than pinning a minor version; pinning
# 26.5 is how this workflow silently fell back to Xcode 16.4 and failed on every run. If hosted
# images ever fall behind the SDK floor again, point `runs-on` at a self-hosted label. The
# pre-push hook (Scripts/install-git-hooks.sh) is the always-available, no-CI complement.
#
# Keep IPHONEOS_DEPLOYMENT_TARGET at the floor the product actually claims (26.0). A deployment
# target above the runner's SDK is a hard build error, so raising it to the latest point release
# silently makes this workflow unrunnable on hosted images.
#
# Since 2026-08-16 the same build is also the Power-of-10 rule-10 build (Docs/Power-of-10-Swift.md
# §R10): Scripts/spm-wall-check.sh passes SUPPRESS_WARNINGS=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
# GCC_TREAT_WARNINGS_AS_ERRORS=YES, so every warning — including the package warnings Xcode hides
# behind -suppress-warnings for local packages — fails the build. The Swift grep-wall port of the
# Power-of-10 mechanical checks (PowerOfTenBoundaryTests) runs below next to the other grep-walls;
# the Python scanner itself runs in power-of-10.yml on a cheap runner.
#
# Every test step runs through Scripts/run-gated-suites.sh, which writes a result bundle and
# refuses a green run that executed fewer tests than the step's floor: `-only-testing:` matches
# suite names exactly and matches NOTHING on a misspelling, so a bare xcodebuild line can name a
# suite that no longer exists and stay green forever. Tests/FernletTests/CIGateSelectorBoundaryTests
# is the static half (every named suite is declared; every mesh battery is named).
#
# Make this a REQUIRED status check in branch protection so the wall cannot be merged around.

name: S3 Wall

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: s3-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3-wall:
    name: Compiler wall + grep-wall
    # macos-26, not macos-15: the macos-15 image tops out at Xcode 26.3 / the iOS 26.3 SDK, which
    # is too old to compile this app (see the SDK floor check below). macos-26 carries Xcode
    # 26.4.1 through 26.6. Swap for a self-hosted label if hosted images ever fall behind again.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Picks the newest Xcode 26+ and exports it for every later step. Deliberately a *floor*,
      # not a pin: the exact minor version does not matter, being able to read Swift tools 6.2
      # and the iOS 26 SDK does. Missing toolchain = hard failure, never a silent fallback.
      - name: Select the newest Xcode 26+
        run: |
          set -euo pipefail
          shopt -s nullglob
          best_version=""; best_dir=""
          for app in /Applications/Xcode*.app; do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist" 2>/dev/null)" || continue
            [ -n "$version" ] || continue
            major="${version%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            [ "$major" -ge 26 ] || continue
            if [ -z "$best_version" ] || \
               [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best_version="$version"; best_dir="$app/Contents/Developer"
            fi
          done
          if [ -z "$best_dir" ]; then
            echo "::error::No Xcode 26 or newer on this runner. FernletKit needs Swift tools 6.2+ and the iOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected Xcode $best_version ($best_dir)"
          echo "DEVELOPER_DIR=$best_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best_dir" xcodebuild -version
          DEVELOPER_DIR="$best_dir" swift --version

          # The Xcode version is not the real requirement — the iOS SDK it ships is. The app uses
          # API that only exists from the 26.5 SDK on (AgeRangeService.AgeRangeDeclaration
          # .confirmed, in App/Fernlet/AgeAssuranceRequest.swift), so an older SDK fails three minutes
          # in with "has no member 'confirmed'", which looks nothing like a toolchain problem.
          # Fail here instead, in seconds, saying exactly what is missing.
          required_sdk="26.5"
          sdk="$(DEVELOPER_DIR="$best_dir" xcodebuild -version -sdk iphonesimulator SDKVersion | head -1)"
          echo "iOS Simulator SDK: $sdk (require >= $required_sdk)"
          if [ "$(printf '%s\n%s\n' "$required_sdk" "$sdk" | sort -V | head -1)" != "$required_sdk" ]; then
            echo "::error::iOS SDK $sdk is older than the required $required_sdk. Fernlet uses API added in the $required_sdk SDK (AgeRangeService.AgeRangeDeclaration.confirmed). Use a runner image with a newer Xcode, or a self-hosted runner."
            exit 1
          fi

      # iPhone 17 is what the docs and the pre-push hook use, so prefer it — but fall back to the
      # newest available iPhone rather than failing over a device-name change in the image.
      - name: Resolve a simulator destination
        run: |
          set -euo pipefail
          name="iPhone 17"
          if ! xcrun simctl list devices available | grep -qE "^ *${name} \("; then
            fallback="$(xcrun simctl list devices available \
              | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' | sed 's/ *$//' | sort -V | tail -1)"
            if [ -z "$fallback" ]; then
              echo "::error::No iPhone simulator available on this runner."
              xcrun simctl list devices available || true
              exit 1
            fi
            echo "::warning::${name} not available; falling back to ${fallback}."
            name="$fallback"
          fi
          echo "Using simulator: $name"
          echo "FERNLET_DESTINATION=platform=iOS Simulator,name=$name" >> "$GITHUB_ENV"

      - name: Enforcement self-test (prove the wall is load-bearing) + clean-tree check
        run: Scripts/spm-wall-selftest.sh

      - name: Grep-wall (S3BoundaryTests)
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh s3-grep 1 S3BoundaryTests CIGateSelectorBoundaryTests

      - name: No-tracking wall (NoTrackingBoundaryTests)
        # Independent of the S3 wall: this one has no compiler half, because a tracking SDK is an
        # honest new dependency that compiles clean. The test IS the enforcement, so it must run
        # even when the S3 steps above pass. See Docs/No-Tracking-Wall.md.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh no-tracking 1 NoTrackingBoundaryTests

      - name: Power-of-10 grep-wall (PowerOfTenBoundaryTests)
        # The Swift port of Scripts/power-of-10-scan.py (Docs/Power-of-10-Swift.md): function
        # length, force unwraps / traps, swallowed `try?`, unbounded loops, mutable globals, `#if`
        # policy, unsafe seams, the assertion-density floor, and the rule-10 build-setting pins.
        # Reads the same allowlist as the scanner, so the two cannot disagree about an exemption.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh power-of-10 1 PowerOfTenBoundaryTests

      - name: Localization wall
        # Also a no-compiler-half wall, and every failure it catches is SILENT in ordinary
        # development: a package string that resolves against the wrong bundle renders English
        # forever with a clean build; a changed sealed-column rawValue drops symptoms out of an
        # encrypted history with no error; a drifted widget token leaves the widget on the
        # neutral companion in a separate process no app test observes. Nothing here is visible
        # in an English simulator run, which is why it has to run on every push.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh localization 1 LocalizationBoundaryTests

      - name: Key-custody + at-rest-format tripwires
        # Same shape as the no-tracking wall: no compiler half, so these suites ARE the
        # enforcement (Docs/Verifiability.md §2, §4) and must run here for the "cannot merge
        # green" claim in Docs/Release-Process.md §1 to be true. Simulator-safe by design:
        # KeyCustodyBoundaryTests drives the production key stores against per-test UUID
        # keychain services (plus the simulator's own data-protection keychain for the two
        # well-known rows) and pins the one passcode-gated class in source, so no device
        # passcode is needed. The remaining suites are pure crypto format pins, plus
        # IdentityProvisioningReadTests (F-1, 2026-09-06): the fail-closed identity read whose
        # source wall keeps a transient keychain error from minting over a live identity.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh key-custody 1 \
            KeyCustodyBoundaryTests \
            ColumnCryptoDeviceBindingTests \
            SealedBackupFormatPinTests \
            IdentityProvisioningReadTests

      - name: Crypto domain + framing + membership-golden tripwires
        # The third wall with no compiler half. `CryptographicPurposeBoundaryTests` carries the
        # framing trio — including `everySignaturePurposeIsHeldToADeclaredFraming`, which reads the
        # Signature block off disk and fails any purpose not held to a declared framing, the check
        # P6 item 1's new signature domain is the first to rely on. `CryptographicDomainSeparationTests`
        # is the auto-failing inventory (every declared purpose has a row, no purpose is a prefix of
        # another) and `MeshMembershipEventGoldenTests` pins the membership wire vectors, which must
        # never be re-pinned. All three ran only when somebody remembered to run the full suite
        # locally until 2026-09-11. Floor = the measured count at that date; RAISE it when a vector
        # or a purpose is added.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh crypto-goldens 38 \
            CryptographicPurposeBoundaryTests \
            CryptographicDomainSeparationTests \
            MeshMembershipEventGoldenTests

      - name: Mesh acceptance batteries (P3 / P4 / P5 / P6) + the CI selector wall
        # The three phases' acceptance batteries (Docs/Plan-ProximityKit-Network-Migration-2026-08-27.md
        # §11.4, §23.4) ran only by hand until 2026-09-06. Tier 1 throughout: FakePeerNetwork, an
        # injected clock, no radio, no wall-clock sleeps — ~2 minutes on a hosted runner.
        #
        # The decomposition below was RE-MEASURED per suite at P6 item 9, from that item's own
        # gated run (`Scripts/run-gated-suites.sh mesh-batteries 1 <this exact list>` at floor 1,
        # read off the result bundle). Terms:
        #   108  the P3/P4/P5 acceptance batteries + the two convergence generators
        #        (MeshConvergenceScheduleTests, MeshConvergencePropertyTests) + the routed
        #        convergence battery. 105 at P6 item 7; item 9 added rectangle G's property cell
        #        and two rectangle pins to MeshRoutedDrainConvergenceTests (now 19).
        #  +  4  CIGateSelectorBoundaryTests' own — the static half of this guard.
        #  +  8  MeshRoutedRefusalBudgetTests — the per-sender pre-store refusal bound the P5
        #        post-close review added.
        #  + 27  MeshPairwiseFoundingTests (P6 item 2: the proximity-join founding — the app's ONLY
        #        session entry, and the only suite that drives the real commit/founding/admission/
        #        delivery path with nothing seeded).
        #  + 32  P6 item 4's three text suites (16 + 3 + 13): the routed text body's framing, its
        #        FIVE hostile shapes and its cap formula; the sender's outcome table; and text
        #        delivered and PROJECTED end to end through the real founding path.
        #  + 30  P6 item 5's two allowance suites and item 8's drain-wall home (6 + 5 + 19): the
        #        retry planner, the two lists on a rig, and the retirement/parking walls — an
        #        AVAILABILITY wall against an attacker-choosable list position.
        #  + 44  P6 item 6's four heart suites (7 + 6 + 16 + 15): the header-only body and its four
        #        hostile shapes, the `.singleRecipient` flip with the shape fence in both
        #        directions, the ack ceremony end to end on a real two-node founding, and the
        #        sender's five gates + consume-on-stage.
        #  + 26  MeshRoutedLockedDeviceTests, gated by P6 item 9 and priced on its OWN argument
        #        rather than riding the drain wall's: it is 26 behaviour cells over five store
        #        states and two independent knobs, not a zero-list wall, and it is where item 7's
        #        launch-restore decision table and item 6's W2 rows live.
        #  + 21  P6 item 9's eight acceptance suites (2 + 2 + 2 + 3 + 2 + 3 + 2 + 5): key
        #        advertisement, pairwise identity, per-type caps, text routing, projection retry,
        #        the heart ceremony, honesty and determinism.
        #  = 300 tests in 50 suites.
        # `MeshRoutedDrainTests` is GATED from P8 item 1 (2026-09-18): 43 behaviour cells (the block used to say 37 — a number never measured; the suite already held 43 at the P6 close-out `82fc4d7`) — one of
        # them P6 item 8's handed-over departed-origin custodian cell — that ran on no CI line until
        # then. Like `MeshRoutedLockedDeviceTests` it is deliberately NOT pinned by name in
        # CIGateSelectorBoundaryTests: it is a behaviour suite, not a zero-list wall, and THIS floor
        # is what stops it being dropped from the line.
        # MEASURED at P8 item 1 on a Mac, 2026-09-18, three runs back to back on one warm bundle:
        #   without `MeshRoutedDrainTests` (the 56-suite list)  — 316 ran, 0 failed, 153 s
        #   with    `MeshRoutedDrainTests` (57 suites)          — 359 ran, 0 failed, 157 s  (+43, +4 s;
        #     the same 57-suite list measured 157 / 159 / 160 s across three runs, so +4 s is inside noise
        #     and +11 s for the fourteen is three to four times it)
        #   plus the fourteen named below (71 suites)           — 606 ran, 0 failed, 168 s  (+247, +11 s)
        # The fourteen are PRICED and still ungated — the owner's call; cost = 11 s for 247 cells:
        #   item 1's three key-agreement suites (30): MeshKeyAgreementFoldTests 14,
        #     MeshKeyAgreementVerificationTests 11, MeshKeyAgreementSchemaTests 5;
        #   the 51 photo-delivery cells the key-advertisement clause promotes by citation:
        #     MeshKeyAdvertisementDeliveryTests 26, MeshRoutedPhotoDeliveryTests 17,
        #     MeshRoutedPhotoSenderTests 8;
        #   eight of the larger remaining ungated routed suites (166) — NOT the eight largest: the
        #     32-cell MeshRoutedInventoryDeltaTests is deliberately outside this price — MeshRoutedManifestSigningTests 27,
        #     MeshRoutedCustodyHandoffTests 26, MeshRoutedCapacityTests 22, MeshRoutedItemSealTests 21,
        #     MeshRoutedTypeRegistryTests 19, MeshRoutedInventoryBuilderTests 18,
        #     MeshRoutedCustodyEvidenceTests 17, MeshRoutedStoreIsolationTests 16.
        # P6 item 9's handoff said "~243 across fourteen suites" and its itemisation lived in a scratch
        # file that is gone; these fourteen MEASURE 247. The measured delta is what is recorded here,
        # never the remembered estimate. Gating all fourteen would put the step at 606 cells / 168 s.
        # The floor is MEASURED, never inferred: 300 is what this exact step list executed at P6
        # item 9. Note the count is over `@Test` FUNCTIONS, not parameterized cases — measured, not
        # assumed: MeshRoutedDrainConvergenceTests contributes 19 while running a 40-cell and a
        # 12-cell rectangle. RAISE this as suites grow; never lower it in passing.
        # P7 item 7 added the six MeshP7*AcceptanceTests suites (13 `@Test` functions by count)
        # without raising the floor (no toolchain to measure with). RE-MEASURED at P8 item 0 on
        # 2026-09-18, on a Mac, with this exact list at floor 300: **316 ran, 0 failed** (the
        # script's own bundle count). 316 = 300 + 13 (P7) + 2 (P8 item 0 (a) and (d): the
        # two-ordering asymmetric-commit cell — one @Test function — and the custody-yield cell in
        # MeshPairwiseFoundingTests, now 29) + 1 that the console total does not attribute to a
        # suite; the floor is the measured number, never the arithmetic. RAISED to **359** at P8
        # item 1 (2026-09-18) by gating `MeshRoutedDrainTests`: 316 + 43, measured on the same bundle
        # (`mesh-with` run, "359 test(s) ran, 0 failed"), and shown red once at 359 with the suite
        # removed before it was committed.
        # CIGateSelectorBoundaryTests is the static half of this guard — every suite named on any
        # run-gated-suites.sh line must be a declared suite, and every MeshP<n>*AcceptanceTests /
        # convergence battery declared in the tree must be named here — and it also runs on the first
        # wall step, so editing this step cannot silence it.
        run: |
          set -euo pipefail
          Scripts/run-gated-suites.sh mesh-batteries 359 \
            CIGateSelectorBoundaryTests \
            MeshRoutedRefusalBudgetTests \
            MeshPairwiseFoundingTests \
            MeshRoutedTextBodyTests \
            MeshRoutedTextSenderTests \
            MeshRoutedTextDeliveryTests \
            MeshRoutedRetryPlanTests \
            MeshRoutedRetryAllowanceTests \
            MeshRoutedDrainWallTests \
            MeshRoutedDrainTests \
            MeshRoutedHeartBodyTests \
            MeshRoutedHeartTargetTests \
            MeshRoutedHeartCeremonyTests \
            MeshSessionHeartTests \
            MeshP3SessionAcceptanceTests \
            MeshP3RotationAcceptanceTests \
            MeshP3RestoreMatrixAcceptanceTests \
            MeshP3InteropAcceptanceTests \
            MeshConvergenceScheduleTests \
            MeshConvergencePropertyTests \
            MeshP4ScenarioMatrixAcceptanceTests \
            MeshP4ConvergencePropertyAcceptanceTests \
            MeshP4QuorumAcceptanceTests \
            MeshP4WorkedExampleAcceptanceTests \
            MeshP4EpochAcceptanceTests \
            MeshP4ContentAcceptanceTests \
            MeshP4LedgerCommitAcceptanceTests \
            MeshP4DeferralAcceptanceTests \
            MeshP4DeterminismAcceptanceTests \
            MeshRoutedDrainConvergenceTests \
            MeshP5ManifestAcceptanceTests \
            MeshP5CustodyAndReceiptAcceptanceTests \
            MeshP5AckStageAcceptanceTests \
            MeshP5BackpressureAcceptanceTests \
            MeshP5LockedDeviceAcceptanceTests \
            MeshP5PartitionDrainAcceptanceTests \
            MeshP5TypeRegistryAcceptanceTests \
            MeshP5RelayScopeAcceptanceTests \
            MeshP5ReplayAcceptanceTests \
            MeshP5OtherBranchDeliveryAcceptanceTests \
            MeshP5HonestyAcceptanceTests \
            MeshP5DeterminismAcceptanceTests \
            MeshRoutedLockedDeviceTests \
            MeshP6KeyAdvertisementAcceptanceTests \
            MeshP6PairwiseIdentityAcceptanceTests \
            MeshP6PerTypeCapAcceptanceTests \
            MeshP6TextRoutingAcceptanceTests \
            MeshP6ProjectionRetryAcceptanceTests \
            MeshP6HeartCeremonyAcceptanceTests \
            MeshP6HonestyAcceptanceTests \
            MeshP6DeterminismAcceptanceTests \
            MeshP7RunPolicyAcceptanceTests \
            MeshP7GateWriterAcceptanceTests \
            MeshP7RadioSeamsAcceptanceTests \
            MeshP7PollerAcceptanceTests \
            MeshP7ResumeAcceptanceTests \
            MeshP7HonestyAcceptanceTests
