# S3 privacy-wall enforcement (Docs/Security-Hardening-Plan-2026-06-27.md, WI-3).
#
# The carve-up's security feature — AIProviders/CloudKitSync being *structurally incapable* of
# reaching the sealed Private* stores — is only load-bearing when the build runs under
# DIAGNOSE_MISSING_TARGET_DEPENDENCIES=YES_ERROR (the flag must be on the build command; it does
# not reach the synthesized SwiftPM targets from the pbxproj). This workflow runs that check on
# every push/PR so a forbidden cross-wall `import` can never land green.
#
# RUNNER REQUIREMENT: macOS with an **iOS 26.5 SDK or newer** (any Xcode that ships one). Two
# separate floors are in play and both are checked below, in seconds, rather than surfacing as a
# confusing build failure minutes in:
#   * Swift tools 6.2 — FernletKit/Package.swift's tools version. An older toolchain cannot even
#     resolve the package ("using Swift tools version 6.2.0 but the installed version is 6.1.0").
#   * the iOS 26.5 SDK — the app uses API introduced there (AgeRangeService.AgeRangeDeclaration
#     .confirmed, in App/Fernlet/AgeAssuranceRequest.swift).
# The job selects the NEWEST Xcode 26+ on the image rather than pinning a minor version; pinning
# 26.5 is how this workflow silently fell back to Xcode 16.4 and failed on every run. If hosted
# images ever fall behind the SDK floor again, point `runs-on` at a self-hosted label. The
# pre-push hook (Scripts/install-git-hooks.sh) is the always-available, no-CI complement.
#
# Keep IPHONEOS_DEPLOYMENT_TARGET at the floor the product actually claims (26.0). A deployment
# target above the runner's SDK is a hard build error, so raising it to the latest point release
# silently makes this workflow unrunnable on hosted images.
#
# Make this a REQUIRED status check in branch protection so the wall cannot be merged around.

name: S3 Wall

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: s3-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3-wall:
    name: Compiler wall + grep-wall
    # macos-26, not macos-15: the macos-15 image tops out at Xcode 26.3 / the iOS 26.3 SDK, which
    # is too old to compile this app (see the SDK floor check below). macos-26 carries Xcode
    # 26.4.1 through 26.6. Swap for a self-hosted label if hosted images ever fall behind again.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Picks the newest Xcode 26+ and exports it for every later step. Deliberately a *floor*,
      # not a pin: the exact minor version does not matter, being able to read Swift tools 6.2
      # and the iOS 26 SDK does. Missing toolchain = hard failure, never a silent fallback.
      - name: Select the newest Xcode 26+
        run: |
          set -euo pipefail
          shopt -s nullglob
          best_version=""; best_dir=""
          for app in /Applications/Xcode*.app; do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist" 2>/dev/null)" || continue
            [ -n "$version" ] || continue
            major="${version%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            [ "$major" -ge 26 ] || continue
            if [ -z "$best_version" ] || \
               [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best_version="$version"; best_dir="$app/Contents/Developer"
            fi
          done
          if [ -z "$best_dir" ]; then
            echo "::error::No Xcode 26 or newer on this runner. FernletKit needs Swift tools 6.2+ and the iOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected Xcode $best_version ($best_dir)"
          echo "DEVELOPER_DIR=$best_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best_dir" xcodebuild -version
          DEVELOPER_DIR="$best_dir" swift --version

          # The Xcode version is not the real requirement — the iOS SDK it ships is. The app uses
          # API that only exists from the 26.5 SDK on (AgeRangeService.AgeRangeDeclaration
          # .confirmed, in App/Fernlet/AgeAssuranceRequest.swift), so an older SDK fails three minutes
          # in with "has no member 'confirmed'", which looks nothing like a toolchain problem.
          # Fail here instead, in seconds, saying exactly what is missing.
          required_sdk="26.5"
          sdk="$(DEVELOPER_DIR="$best_dir" xcodebuild -version -sdk iphonesimulator SDKVersion | head -1)"
          echo "iOS Simulator SDK: $sdk (require >= $required_sdk)"
          if [ "$(printf '%s\n%s\n' "$required_sdk" "$sdk" | sort -V | head -1)" != "$required_sdk" ]; then
            echo "::error::iOS SDK $sdk is older than the required $required_sdk. Fernlet uses API added in the $required_sdk SDK (AgeRangeService.AgeRangeDeclaration.confirmed). Use a runner image with a newer Xcode, or a self-hosted runner."
            exit 1
          fi

      # iPhone 17 is what the docs and the pre-push hook use, so prefer it — but fall back to the
      # newest available iPhone rather than failing over a device-name change in the image.
      - name: Resolve a simulator destination
        run: |
          set -euo pipefail
          name="iPhone 17"
          if ! xcrun simctl list devices available | grep -qE "^ *${name} \("; then
            fallback="$(xcrun simctl list devices available \
              | sed -n 's/^ *\(iPhone [^(]*\) (.*/\1/p' | sed 's/ *$//' | sort -V | tail -1)"
            if [ -z "$fallback" ]; then
              echo "::error::No iPhone simulator available on this runner."
              xcrun simctl list devices available || true
              exit 1
            fi
            echo "::warning::${name} not available; falling back to ${fallback}."
            name="$fallback"
          fi
          echo "Using simulator: $name"
          echo "FERNLET_DESTINATION=platform=iOS Simulator,name=$name" >> "$GITHUB_ENV"

      - name: Enforcement self-test (prove the wall is load-bearing) + clean-tree check
        run: Scripts/spm-wall-selftest.sh

      - name: Grep-wall (S3BoundaryTests)
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project App/Fernlet.xcodeproj \
            -scheme Fernlet \
            -destination "$FERNLET_DESTINATION" \
            -only-testing:FernletTests/S3BoundaryTests

      - name: No-tracking wall (NoTrackingBoundaryTests)
        # Independent of the S3 wall: this one has no compiler half, because a tracking SDK is an
        # honest new dependency that compiles clean. The test IS the enforcement, so it must run
        # even when the S3 steps above pass. See Docs/No-Tracking-Wall.md.
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project App/Fernlet.xcodeproj \
            -scheme Fernlet \
            -destination "$FERNLET_DESTINATION" \
            -only-testing:FernletTests/NoTrackingBoundaryTests

      - name: Key-custody + at-rest-format tripwires
        # Same shape as the no-tracking wall: no compiler half, so these suites ARE the
        # enforcement (Docs/Verifiability.md §2, §4) and must run here for the "cannot merge
        # green" claim in Docs/Release-Process.md §1 to be true. Simulator-safe by design:
        # KeyCustodyBoundaryTests drives the production key stores against per-test UUID
        # keychain services (plus the simulator's own data-protection keychain for the two
        # well-known rows) and pins the one passcode-gated class in source, so no device
        # passcode is needed. The remaining suites are pure crypto format pins.
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project App/Fernlet.xcodeproj \
            -scheme Fernlet \
            -destination "$FERNLET_DESTINATION" \
            -only-testing:FernletTests/KeyCustodyBoundaryTests \
            -only-testing:FernletTests/ColumnCryptoDeviceBindingTests \
            -only-testing:FernletTests/SealedBackupFormatPinTests
